services:
  web:
    build: .
    restart: unless-stopped
    environment:
      TRADING_TOOL_STORAGE: "local"
      TRADING_TOOL_START_WORKER: "0"
    volumes:
      - ./data:/app/data
      - ./logs:/app/logs
    expose:
      - "8501"

  worker:
    build: .
    restart: unless-stopped
    command: ["python", "background_worker.py"]
    environment:
      TRADING_TOOL_STORAGE: "local"
      TRADING_TOOL_START_WORKER: "1"
    volumes:
      - ./data:/app/data
      - ./logs:/app/logs

  caddy:
    image: caddy:2
    restart: unless-stopped
    depends_on:
      - web
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./deploy/caddy/Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config

volumes:
  caddy_data:
  caddy_config:
